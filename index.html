<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سيرفر الاتصال المخصص</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 340px; border: 2px solid #3b82f6; z-index: 10; }
        input { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        button:hover { background: #1d4ed8; }
        .create-btn { background: #10b981; }
        .create-btn:hover { background: #059669; }
        
        /* حاوية الاتصال تملء الشاشة بالكامل وتخفي كل شي خلفها */
        #callScreen { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: #0f172a; z-index: 999; }
        #jitsiContainer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- واجهة الدخول -->
    <div class="card" id="loginBox">
        <h2>نظام الاتصال المخصص</h2>
        <span style="background: #8b5cf6; color: #fff; padding: 3px 10px; font-size: 12px; border-radius: 20px; display: inline-block; margin-bottom: 20px;">الإصدار المباشر v7.0</span>
        
        <input type="text" id="userName" placeholder="اكتب اسمك الكريم...">
        <button class="create-btn" onclick="startApp()">دخول / إنشاء الغرفة</button>
    </div>

    <!-- واجهة الاتصال الحقيقية والكاملة -->
    <div id="callScreen">
        <div id="jitsiContainer"></div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        let api = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('room')) {
                document.querySelector('.card h2').innerText = "انضمام إلى غرفة";
                document.querySelector('.create-btn').innerText = "انضمام مباشر";
            }
        };

        function startApp() {
            let name = document.getElementById('userName').value.trim();
            if (!name) {
                alert("يرجى كتابة اسمك أولاً!");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            let roomCode = urlParams.get('room');

            // إذا ماكو غرفة بالرابط، نولد وحدة ونحدث شريط العنوان (URL) بدون إعادة تحميل
            if (!roomCode) {
                roomCode = Math.floor(100000 + Math.random() * 900000).toString();
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomCode;
                window.history.pushState({path: newUrl}, '', newUrl);
            }

            // إخفاء كارت الدخول وإظهار شاشة الاتصال بالكامل
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('callScreen').style.display = 'block';

            const domain = "meet.jit.si";
            const options = {
                roomName: "AhmedAbdullah-DirectRoom-" + roomCode,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#jitsiContainer'),
                userInfo: { displayName: name },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: true // الصوت فقط شغال والفيديو مغلق كافتراضي للاستقرار
                },
                interfaceConfigOverwrite: {
                    // إبقاء أزرار التحكم الأساسية (الكتم، المغادرة) واضحة وحقيقية 100%
                    TOOLBAR_BUTTONS: [
                        'microphone', 'hangup', 'chat', 'settings'
                    ],
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_BRANDING_WATERMARK: false,
                    DEFAULT_BACKGROUND: '#0f172a'
                }
            };

            api = new JitsiMeetExternalAPI(domain, options);

            // إذا المستخدم ضغط زر المغادرة من داخل شاشة الاتصال، يرجع للبداية وينظف الرابط
            api.addEventListener('videoConferenceLeft', () => {
                window.location.href = window.location.pathname;
            });
        }
    </script>

</body>
</html>
