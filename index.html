<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سيرفر الاتصال المخصص</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 340px; border: 2px solid #3b82f6; }
        input { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        button:hover { background: #1d4ed8; }
        .create-btn { background: #10b981; }
        .create-btn:hover { background: #059669; }
        
        /* واجهة الاتصال */
        #callScreen { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: #0f172a; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .call-box { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.7); width: 350px; }
        .status { font-size: 20px; margin-bottom: 15px; color: #4ade80; font-weight: bold; }
        .control-btn { padding: 12px 25px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; width: 100%; }
        .mute-btn { background: #eab308; color: #000; margin-bottom: 10px; }
        .hangup-btn { background: #ef4444; color: #fff; }
        
        /* صندوق جيتسي الخفي */
        #jitsiContainer { position: absolute; width: 1px; height: 1px; top: -9999px; left: -9999px; opacity: 0; visibility: hidden; pointer-events: none; }
        .room-display { background: #0f172a; padding: 8px; border-radius: 5px; color: #38bdf8; font-family: monospace; font-size: 18px; margin-bottom: 15px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- واجهة الدخول الرئيسية -->
    <div class="card" id="loginBox">
        <h2>نظام الاتصال المخصص</h2>
        <span style="background: #8b5cf6; color: #fff; padding: 3px 10px; font-size: 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px;">الإصدار الذكي v4.0</span>
        
        <!-- قسم إنشاء غرفة جديدة -->
        <div style="margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px;">
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">أنشئ غرفة جديدة وخذ كودها لأصدقائك</p>
            <input type="text" id="creatorName" placeholder="اسمك الكريم">
            <button class="create-btn" onclick="createRoom()">إنشاء غرفة ودخول</button>
        </div>

        <!-- قسم الانضمام بغرفة موجودة -->
        <div>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">أو انضم بغرفة أعطاك اياها صديقك</p>
            <input type="text" id="joinName" placeholder="اسمك الكريم">
            <input type="text" id="joinRoomCode" placeholder="الصق كود الغرفة هنا">
            <button onclick="joinRoom()">انضمام إلى الغرفة</button>
        </div>
    </div>

    <!-- واجهة المكالمة -->
    <div id="callScreen">
        <div class="call-box">
            <h2>غرفة الاتصال النشطة</h2>
            <div class="status" id="callStatus">متصل بالصوت...</div>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 5px;">كود الغرفة الحالي:</p>
            <div class="room-display" id="activeRoomCode">----</div>
            <p id="displayNameView" style="color: #94a3b8; margin-bottom: 15px;"></p>
            
            <button class="control-btn mute-btn" onclick="toggleMute()">كتم / إلغاء الكتم</button>
            <button class="control-btn hangup-btn" onclick="endCall()">مغادرة المكالمة</button>
        </div>
        <div id="jitsiContainer"></div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        let api = null;

        // توليد رقم غرفة عشوائي مكون من 5 أرقام
        function generateRoomCode() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        // إنشاء غرفة جديدة (من قبل المالك)
        function createRoom() {
            let name = document.getElementById('creatorName').value.trim();
            if (!name) {
                alert("يرجى كتابة اسمك أولاً!");
                return;
            }
            let roomCode = generateRoomCode();
            startCallSession(name, roomCode);
        }

        // الانضمام لغرفة عبر الكود (من قبل الضيف)
        function joinRoom() {
            let name = document.getElementById('joinName').value.trim();
            let roomCode = document.getElementById('joinRoomCode').value.trim();
            
            if (!name || !roomCode) {
                alert("يرجى كتابة الاسم وكود الغرفة!");
                return;
            }
            startCallSession(name, roomCode);
        }

        // دالة بدء الاتصال الفعلية
        function startCallSession(name, roomCode) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('callScreen').style.display = 'flex';
            document.getElementById('displayNameView').innerText = "المستخدم: " + name;
            document.getElementById('activeRoomCode').innerText = roomCode;

            const domain = "meet.jit.si";
            const options = {
                roomName: "AhmedAbdullah-SmartEngine-" + roomCode,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#jitsiContainer'),
                userInfo: { displayName: name },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: true
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: [],
                    filmStripOnly: true,
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_BRANDING_WATERMARK: false
                }
            };

            api = new JitsiMeetExternalAPI(domain, options);
        }

        function toggleMute() {
            if (api) {
                api.executeCommand('toggleAudio');
            }
        }

        function endCall() {
            if (api) {
                api.dispose();
            }
            document.getElementById('callScreen').style.display = 'none';
            document.getElementById('loginBox').style.display = 'flex';
        }
    </script>

</body>
</html>
