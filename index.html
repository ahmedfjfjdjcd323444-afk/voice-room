<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غرفة صوتية - WebRTC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, sans-serif; }
  body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; color: #fff; }
  .card { background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  h1 { text-align: center; font-size: 22px; margin-bottom: 20px; }
  .group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; opacity: 0.8; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; background: rgba(0,0,0,0.3); color: #fff; font-size: 15px; outline: none; }
  input:focus { border-color: #4fc3f7; }
  button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .btn-primary { background: #4fc3f7; color: #0f2027; }
  .btn-primary:hover { background: #81d4fa; }
  .btn-danger { background: #ef5350; color: #fff; }
  .btn-danger:hover { background: #e57373; }
  .btn-warn { background: #ffb74d; color: #0f2027; }
  .btn-warn:hover { background: #ffcc80; }
  .divider { display: flex; align-items: center; margin: 18px 0; color: rgba(255,255,255,0.5); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.2); }
  .divider span { padding: 0 10px; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; }
  .hidden { display: none !important; }
  #room-code { font-size: 34px; text-align: center; letter-spacing: 6px; font-weight: bold; color: #81d4fa; background: rgba(0,0,0,0.35); padding: 12px; border-radius: 12px; margin-bottom: 16px; }
  .status { text-align: center; font-size: 13px; opacity: 0.7; margin-bottom: 12px; min-height: 18px; }
  .members { margin-top: 16px; max-height: 180px; overflow-y: auto; }
  .member { background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #66bb6a; }
  .muted-dot { background: #ef5350; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔊 غرفة صوتية (اعتماد كلي على Relay)</h1>

    <div id="screen-join">
      <div class="group">
        <label>اسمك</label>
        <input id="name-input" type="text" placeholder="أدخل اسمك..." maxlength="30">
        <div id="join-error" style="color:#ef5350; font-size:12px; margin-top:4px; min-height:16px;"></div>
      </div>
      <div class="group">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; opacity:1;">
          <input id="noise-supp" type="checkbox"> تنقية الضوضاء (للأماكن البعيدة)
        </label>
      </div>
      <div class="group">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; opacity:1;">
          <input id="proc-audio" type="checkbox" checked> تسخين الصوت (مثل Google Meet)
        </label>
      </div>
      <button class="btn-primary" onclick="createRoom()">➕ إنشاء غرفة</button>
      <div class="divider"><span>أو</span></div>
      <div class="group">
        <label>كود الغرفة</label>
        <input id="code-input" type="text" placeholder="0000" maxlength="6" style="text-align:center; letter-spacing:4px; font-size:22px;">
      </div>
      <button class="btn-primary" onclick="joinRoom()">📞 إنضمام</button>
    </div>

    <div id="screen-call" class="hidden">
      <div id="room-code" onclick="copyCode()" style="cursor:pointer;" title="اضغط للنسخ">0000 <span style="font-size:14px; letter-spacing:0;">📋</span></div>
      <div class="status" id="status-text">جاري التحميل...</div>
      <div class="status" id="count-text" style="opacity:0.6;"></div>
      <div id="audio-hint" class="hidden" style="background:rgba(255,183,77,0.15); border:1px solid #ffb74d; border-radius:10px; padding:12px; text-align:center; margin-bottom:12px; font-size:14px; font-weight:bold; color:#ffb74d; cursor:pointer;" onclick="playAllAudio()">🔊 المس هذه الشاشة لسماع الصوت</div>
      <div class="row">
        <button class="btn-warn" id="mute-btn" onclick="toggleMute()">🔇 كتم الصوت</button>
        <button class="btn-danger" onclick="leaveRoom()">📵 مغادرة</button>
      </div>
      <div class="group" style="margin-top:16px;">
        <label>تضخيم الصوت: <span id="gain-val" style="color:#ffb74d; font-weight:bold;">0</span> dB</label>
        <input id="gain-slider" type="range" min="-20" max="30" step="0.5" value="0" oninput="setGain(this.value)" style="width:100%; accent-color:#ffb74d;">
      </div>
      <div class="members" id="members-list"></div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    let peer = null;
    let localStream = null;
    let sendStream = null;
    let procNodes = [];
    let roomCode = '';
    let isHost = false;
    let myName = '';
    let conns = {};

    const $ = id => document.getElementById(id);

    let audioCtx = null;
    let masterGain = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 1;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    async function startCall() {
      myName = $('name-input').value.trim();
      if (!myName) {
        $('name-input').style.borderColor = '#ef5350';
        $('name-input').style.background = 'rgba(239,83,80,0.15)';
        $('join-error').textContent = '⚠ اكتب اسمك أولاً حتى تدخل الغرفة';
        $('name-input').focus();
        return false;
      }
      $('name-input').style.borderColor = '';
      $('name-input').style.background = '';
      $('join-error').textContent = '';
      const useNoise = $('noise-supp').checked;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: useNoise, autoGainControl: useNoise }
        });
      } catch (e) {
        alert('ماكو مايك أو ممنوع الوصول للميكروفون!');
        return false;
      }
      ensureAudioCtx();
      buildSendStream();
      return true;
    }

    function buildSendStream() {
      sendStream = localStream;
      procNodes.forEach(n => { try { n.disconnect(); } catch (e) {} });
      procNodes = [];
      const useProc = $('proc-audio').checked;
      if (!useProc || isTouch || !audioCtx || audioCtx.state !== 'running') return;
      try {
        const src = audioCtx.createMediaStreamSource(localStream);
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 100;
        hp.Q.value = 0.7;
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 8000;
        lp.Q.value = 0.7;
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -30;
        comp.knee.value = 20;
        comp.ratio.value = 8;
        comp.attack.value = 0.003;
        comp.release.value = 0.25;
        const dest = audioCtx.createMediaStreamDestination();
        src.connect(hp);
        hp.connect(lp);
        lp.connect(comp);
        comp.connect(dest);
        sendStream = dest.stream;
        procNodes = [src, hp, lp, comp, dest];
      } catch (e) {
        sendStream = localStream;
      }
    }

    const RTC_CONFIG = {
      iceServers: [
        { urls: [
          'stun:stun.l.google.com:19302',
          'stun:stun1.l.google.com:19302',
          'stun:stun2.l.google.com:19302',
          'stun:stun3.l.google.com:19302',
          'stun:stun4.l.google.com:19302'
        ] },
        {
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:443',
            'turns:openrelay.metered.ca:443'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    function makePeer(code, isJoin) {
      const id = isHost ? 'room-' + code : 'p-' + Math.random().toString(36).slice(2, 10);
      peer = new Peer(id, { debug: 0, config: RTC_CONFIG });
      peer.on('open', onPeerOpen);
      peer.on('connection', handleIncomingConn);
      peer.on('call', handleIncomingCall);
      peer.on('error', err => {
        if (err.type === 'unavailable-id' && isHost) {
          roomCode = String(Math.floor(1000 + Math.random() * 9000));
          $('status-text').textContent = 'الكود مستخدم، غيّرناه تلقائياً إلى ' + roomCode;
          try { peer.destroy(); } catch (e) {}
          makePeer(roomCode, false);
          peer.on('open', () => {
            $('room-code').innerHTML = roomCode + ' <span style="font-size:14px; letter-spacing:0;">📋</span>';
          });
        } else if (err.type === 'peer-unavailable') {
          $('status-text').textContent = 'ماكو غرفة بهذا الكود، جرّب مرة ثانية...';
          retryJoin();
        } else {
          console.error(err);
        }
      });
    }

    function onPeerOpen(id) {
      joinRetries = 0;
      if (isHost) {
        roomCode = id.replace('room-', '');
        $('room-code').innerHTML = roomCode + ' <span style="font-size:14px; letter-spacing:0;">📋</span>';
        $('status-text').textContent = 'الغرفة جاهزة! شارك الكود مع أصدقائك';
      } else {
        $('status-text').textContent = 'جاري الإتصال بالغرفة...';
        connectToHost();
      }
      showScreen('call');
    }

    function connectToHost() {
      const old = conns['room-' + roomCode];
      if (old) {
        try { old.data && old.data.close(); } catch (e) {}
        try { old.media && old.media.close(); } catch (e) {}
      }
      const data = peer.connect('room-' + roomCode, { reliable: true });
      conns['room-' + roomCode] = { data, media: null, name: 'صاحب الغرفة' };
      data.on('open', () => { clearTimeout(joinTimer); $('status-text').textContent = 'تم الاتصال بالغرفة!'; sendName(data); });
      data.on('data', msg => handleMessage(data, msg));
      data.on('close', () => removeMember(data.peer));
      const media = peer.call('room-' + roomCode, sendStream);
      media.on('stream', stream => addAudio('room-' + roomCode, stream));
      media.on('close', () => removeMember('room-' + roomCode));
      conns['room-' + roomCode].media = media;
      joinTimer = setTimeout(() => {
        if (!data.open) {
          $('status-text').textContent = 'الاتصال بطيء، نحاول مرة ثانية...';
          retryJoin();
        }
      }, 25000);
    }

    async function createRoom() {
      ensureAudioCtx();
      if (!(await startCall())) return;
      isHost = true;
      roomCode = String(Math.floor(1000 + Math.random() * 9000));
      makePeer(roomCode, false);
    }

    async function joinRoom() {
      ensureAudioCtx();
      roomCode = $('code-input').value.trim();
      if (roomCode.length < 4) { alert('دخل كود الغرفة'); return; }
      if (!(await startCall())) return;
      isHost = false;
      makePeer(roomCode, true);
    }

    let joinRetries = 0;
    let joinTimer = null;
    function retryJoin() {
      clearTimeout(joinTimer);
      joinRetries++;
      if (joinRetries > 3) {
        joinRetries = 0;
        alert('ماكو غرفة بهذا الكود! تأكد من الكود');
        leaveRoom();
        return;
      }
      setTimeout(() => {
        $('status-text').textContent = 'جاري الإتصال... (محاولة ' + joinRetries + ')';
        connectToHost();
      }, 1500);
    }

    function handleIncomingConn(conn) {
      if (!conns[conn.peer]) conns[conn.peer] = { data: conn, media: null, name: 'زائر' };
      conns[conn.peer].data = conn;
      conn.on('data', msg => handleMessage(conn, msg));
      conn.on('close', () => removeMember(conn.peer));
      conn.on('open', () => {
        clearTimeout(joinTimer);
        toneJoin();
        if (isHost) {
          const members = Object.keys(conns).filter(id => id !== conn.peer);
          conn.send({ type: 'init', members, myName });
          $('status-text').textContent = 'شخص دخل الغرفة! الأعضاء: ' + (Object.keys(conns).length + 1);
        }
      });
    }

    function handleIncomingCall(call) {
      if (!conns[call.peer]) conns[call.peer] = { data: null, media: null, name: 'زائر' };
      conns[call.peer].media = call;
      call.answer(sendStream);
      call.on('stream', stream => addAudio(call.peer, stream));
      call.on('close', () => removeMember(call.peer));
    }

    function connectTo(id) {
      if (conns[id] || !peer || id === peer.id) return;
      const conn = { data: null, media: null, name: id };
      conns[id] = conn;
      const data = peer.connect(id, { reliable: true });
      data.on('open', () => sendName(data));
      data.on('data', msg => handleMessage(data, msg));
      data.on('close', () => removeMember(id));
      conn.data = data;
      const media = peer.call(id, sendStream);
      media.on('stream', stream => addAudio(id, stream));
      media.on('close', () => removeMember(id));
      conn.media = media;
    }

    function sendName(data) {
      data.send({ type: 'name', name: myName });
    }

    function handleMessage(data, msg) {
      if (!msg) return;
      const id = data.peer;
      if (msg.type === 'init' && !isHost) {
        if (!conns[id]) conns[id] = { data, media: null, name: msg.myName || 'صاحب الغرفة' };
        if (msg.myName) conns[id].name = msg.myName;
        if (msg.members) msg.members.forEach(connectTo);
        renderMembers();
      } else if (msg.type === 'name') {
        if (!conns[id]) conns[id] = { data, media: null, name: msg.name };
        conns[id].name = msg.name;
        renderMembers();
      } else if (msg.type === 'mute') {
        if (conns[id]) conns[id].muted = msg.muted;
        renderMembers();
        if (msg.muted) toneMute(); else toneUnmute();
      }
    }

    const audioEls = [];
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    let cleaningUp = false;

    function playTone(freqs) {
      if (!audioCtx) ensureAudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let t = audioCtx.currentTime;
      freqs.forEach(f => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.35);
        t += 0.22;
      });
    }
    const toneJoin = () => playTone([880, 1174.66]);
    const toneLeave = () => playTone([659.25, 493.88]);
    const toneMute = () => playTone([500]);
    const toneUnmute = () => playTone([900]);

    function broadcast(msg) {
      Object.keys(conns).forEach(id => {
        const c = conns[id];
        if (c && c.data && c.data.open) {
          try { c.data.send(msg); } catch (e) {}
        }
      });
    }
    function playAllAudio() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      let anyStarted = false;
      audioEls.forEach(el => {
        if (el.paused) {
          el.play().then(() => { anyStarted = true; }).catch(() => {});
        }
      });
      if (anyStarted) $('audio-hint').classList.add('hidden');
      else setTimeout(() => { if (audioEls.some(el => !el.paused)) $('audio-hint').classList.add('hidden'); }, 500);
    }
    document.addEventListener('click', playAllAudio);
    document.addEventListener('touchstart', playAllAudio);
    document.addEventListener('keydown', playAllAudio);

    function addAudio(id, stream) {
      const el = document.createElement('audio');
      el.autoplay = true;
      el.playsInline = true;
      el.srcObject = stream;
      document.body.appendChild(el);
      el.play().catch(() => { $('audio-hint').classList.remove('hidden'); });
      audioEls.push(el);
      if (conns[id]) conns[id].audioEl = el;

      if (audioCtx && !isTouch) {
        let tries = 0;
        const route = () => {
          if (audioCtx.state === 'running') {
            try {
              const src = audioCtx.createMediaElementSource(el);
              const g = audioCtx.createGain();
              g.gain.value = 1;
              src.connect(g);
              g.connect(masterGain);
              if (conns[id]) conns[id].mediaNode = g;
              $('status-text').textContent = 'الصوت متصل ✔ (تضخيم مفعّل)';
              return;
            } catch (e) {
              if (conns[id]) conns[id].mediaNode = null;
            }
          }
          if (tries++ < 15) {
            audioCtx.resume().then(() => setTimeout(route, 300)).catch(() => setTimeout(route, 300));
          }
        };
        audioCtx.resume().then(route).catch(route);
      } else if (!isTouch) {
        $('audio-hint').classList.add('hidden');
      }
      $('status-text').textContent = 'الصوت متصل ✔';
      renderMembers();
    }

    function setGain(db) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      const v = Math.pow(10, parseFloat(db) / 20);
      if (masterGain) masterGain.gain.value = v;
      $('gain-val').textContent = db;
    }

    function removeMember(id) {
      const c = conns[id];
      if (c) {
        try { c.data && c.data.close(); } catch (e) {}
        try { c.media && c.media.close(); } catch (e) {}
        if (c.mediaNode) {
          try { c.mediaNode.disconnect(); } catch (e) {}
        }
        if (c.audioEl) {
          c.audioEl.srcObject = null;
          c.audioEl.remove();
          const i = audioEls.indexOf(c.audioEl);
          if (i > -1) audioEls.splice(i, 1);
        }
        delete conns[id];
        if (!cleaningUp) toneLeave();
      }
      renderMembers();
    }

    function renderMembers() {
      const list = $('members-list');
      list.innerHTML = '';
      list.appendChild(memberRow(myName + ' (أنت)', true, false));
      Object.keys(conns).forEach(id => {
        const c = conns[id];
        list.appendChild(memberRow(c.name, false, c.muted));
      });
      $('count-text').textContent = 'الأعضاء: ' + (Object.keys(conns).length + 1) + ' / 12';
    }

    function copyCode() {
      const text = roomCode;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => flashCopy());
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        flashCopy();
      }
    }

    function flashCopy() {
      const el = $('room-code');
      el.innerHTML = '✔ تم النسخ!';
      setTimeout(() => {
        el.innerHTML = roomCode + ' <span style="font-size:14px; letter-spacing:0;">📋</span>';
      }, 1200);
    }

    function memberRow(name, me, muted) {
      const div = document.createElement('div');
      div.className = 'member';
      const span = document.createElement('span');
      span.textContent = name;
      const dot = document.createElement('div');
      dot.className = 'dot' + (muted ? ' muted-dot' : '');
      div.appendChild(span);
      div.appendChild(dot);
      return div;
    }

    function toggleMute() {
      if (!localStream) return;
      const btn = $('mute-btn');
      const wasMuted = localStream.getAudioTracks().some(t => !t.enabled);
      const nowMuted = !wasMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !nowMuted);
      btn.textContent = nowMuted ? '🔊 الغاء الكتم' : '🔇 كتم الصوت';
      Object.keys(conns).forEach(id => {
        if (conns[id]) conns[id].muted = nowMuted;
      });
      renderMembers();
      broadcast({ type: 'mute', muted: nowMuted });
    }

    function leaveRoom() {
      cleaningUp = true;
      Object.keys(conns).forEach(removeMember);
      cleaningUp = false;
      procNodes.forEach(n => { try { n.disconnect(); } catch (e) {} });
      procNodes = [];
      sendStream = null;
      if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      isHost = false;
      roomCode = '';
      $('name-input').value = '';
      $('code-input').value = '';
      showScreen('join');
    }

    function showScreen(name) {
      $('screen-join').classList.toggle('hidden', name !== 'join');
      $('screen-call').classList.toggle('hidden', name !== 'call');
    }

    window.addEventListener('beforeunload', () => {
      cleaningUp = true;
      Object.keys(conns).forEach(removeMember);
      procNodes.forEach(n => { try { n.disconnect(); } catch (e) {} });
      if (peer) peer.destroy();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
    });
  </script>
</body>
</html>
