<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة المحادثة الخاصة</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            font-family: Tahoma, sans-serif;
        }
        #error-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            text-align: center;
        }
        #error-container h2 {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        #jitsi-container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="jitsi-container"></div>

    <!-- استدعاء مكتبة جيتسي الرسمية -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room');

        if (!roomName) {
            document.body.innerHTML = `
                <div id="error-container">
                    <div>
                        <h2>404</h2>
                        <p>عذراً، الغرفة غير موجودة أو رابط الدخول غير صالح.</p>
                    </div>
                </div>
            `;
        } else {
            const domain = "meet.jit.si";
            const options = {
                roomName: roomName,
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#jitsi-container'),
                
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    DEFAULT_LOGO_URL: "",
                    DEFAULT_WELCOME_PAGE_LOGO_URL: "",
                    MOBILE_APP_PROMO: false,
                    HIDE_INVITE_MORE_STEPS: true
                },
                
                configOverwrite: {
                    brandingDataUrl: "",
                    disableInviteFunctions: true,
                    startWithAudioMuted: false,
                    startWithVideoMuted: true,
                    prejoinConfig: {
                        enabled: false
                    },
                    enableInsecureRoomNameWarning: false
                }
            };

            const api = new JitsiMeetExternalAPI(domain, options);

            api.executeCommand('displayName', 'أحمد');

            // مراقب شامل لحذف الشعار وأي روابط تابعة لـ جيتسي فور توليدها
            const observer = new MutationObserver((mutations) => {
                // البحث عن كل العناصر التي تحتوي على شعار، روابط، أو نصوص ترويجية خاصة بهم
                const elementsToRemove = document.querySelectorAll(`
                    .watermark, 
                    .jitsi-icon, 
                    a[href*="jitsi"], 
                    img[src*="jitsi"],
                    [aria-label*="Jitsi Meet Logo"],
                    [title*="Jitsi Meet"]
                `);
                
                elementsToRemove.forEach(el => el.remove());
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        }
    </script>
</body>
</html>
