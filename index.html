<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سيرفري السري</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        input { width: 100%; padding: 12px; font-size: 18px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 18px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>سيرفر الاتصال الخاص</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">حط الكود وخلي ربعك يدخلون وياك</p>
        
        <input type="text" id="roomCode" placeholder="اكتب الكود هنا (مثلا: 123)">
        <button onclick="connectServer()">اتصال بالسيرفر</button>
    </div>

    <script>
        function connectServer() {
            let code = document.getElementById('roomCode').value.trim();
            if (!code) {
                alert("كتب الكود أولاً يا مهندس!");
                return;
            }
            
            // الرابط السري اللي يربطهم بسيرفرك الوهمي
            let mySecretServer = "https://meet.jit.si/AhmedAbdullah-Private-Server-" + code;
            
            // فتح الاتصال الفوري
            window.location.href = mySecretServer;
        }
    </script>

</body>
</html>
